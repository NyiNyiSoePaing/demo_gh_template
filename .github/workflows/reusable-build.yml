name: Reusable build

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment name
        type: string
        required: true
      node-version:
        description: Node.js version to set up
        type: string
        default: "20"
      run-tests:
        type: boolean
        default: true
    secrets:
      DEMO_TOKEN:
        description: Example secret passed from the caller
        required: false
    outputs:
      build-id:
        description: ID generated by the build job
        value: ${{ jobs.build.outputs.build-id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # caller repo's GitHub Environment (vars/secrets/protection rules)
    outputs:
      build-id: ${{ steps.meta.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4   # checks out the CALLER repo

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Show context
        run: |
          echo "Caller repo     : ${{ github.repository }}"
          echo "Caller ref      : ${{ github.ref }}"
          echo "Workflow ref    : ${{ github.workflow_ref }}"
          echo "Environment     : ${{ inputs.environment }}"
          echo "Node            : $(node --version)"
          echo "Run tests       : ${{ inputs.run-tests }}"
          echo "vars.APP_ENV    : ${{ vars.APP_ENV }}"
          ls -la

      - name: Check secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then echo "DEMO_TOKEN received (length ${#DEMO_TOKEN})"; else echo "DEMO_TOKEN not set"; fi

      - name: Tests
        if: ${{ inputs.run-tests }}
        run: echo "pretend tests pass"

      - name: Generate build id
        id: meta
        run: echo "build-id=${{ inputs.environment }}-${GITHUB_RUN_ID}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
